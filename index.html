<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aether API</title>
    <style>
      html,
      body,
      #root {
        background-color: #0c0c0e !important;
        color: #f3f4f6 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #18181f 0%, #0c0c0e 80%);
        transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        pointer-events: auto;
        user-select: none;
      }

      .splash-logo-container {
        position: relative;
        width: 76px;
        height: 76px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash-glow {
        position: absolute;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, rgba(59, 130, 246, 0) 70%);
        filter: blur(14px);
        animation: splash-pulse 2.4s ease-in-out infinite alternate;
      }

      .splash-logo {
        width: 72px;
        height: 72px;
        z-index: 1;
        filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
      }

      .splash-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #ffffff;
        margin: 0 0 6px 0;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .splash-version {
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 2px 6px;
        border-radius: 4px;
      }

      .splash-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        color: #64748b;
        margin: 0 0 24px 0;
      }

      .splash-progress-track {
        width: 160px;
        height: 3px;
        background-color: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        overflow: hidden;
        position: relative;
      }

      .splash-progress-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #3b82f6, #60a5fa);
        border-radius: 3px;
        animation: splash-loading 1.4s ease-in-out infinite;
      }

      @keyframes splash-pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.5;
        }
        100% {
          transform: scale(1.2);
          opacity: 0.9;
        }
      }

      @keyframes splash-loading {
        0% {
          left: -45%;
        }
        100% {
          left: 100%;
        }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
    />
  </head>

  <body>
    <div id="splash-screen" data-tauri-drag-region>
      <div class="splash-logo-container">
        <div class="splash-glow"></div>
        <img src="/src/assets/logo.svg" alt="AetherAPI" class="splash-logo" />
      </div>
      <div class="splash-title">
        AetherAPI
        <span class="splash-version">v0.2.0-beta</span>
      </div>
      <p class="splash-subtitle">Your APIs. Your Files. Your Control.</p>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
