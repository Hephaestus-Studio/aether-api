[package]
name = "aether-api"
version = "0.2.0-beta.3"
description = "Next-generation local-first and git-centric API client"
authors = ["Hephaestus Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = [] }
tauri-plugin-fs = { version = "2.5.1", features = [] }
tauri-plugin-dialog = { version = "2.7.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-shell = { version = "2.3.5", features = [] }
serde_yml = { version = "0.0.13", features = [] }
reqwest = { version = "0.13.4", features = ["json", "cookies", "multipart", "query", "form"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tower = "0.5.2"
notify = { version = "8.2.0", features = [] }
walkdir = { version = "2.5.0", features = [] }
regex = { version = "1.13.1", features = [] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = { version = "2.0.19", features = [] }
tempfile = { version = "3.27.0", features = [] }
fs2 = { version = "0.4.3", features = [] }
zeroize = { version = "1.9.0", features = ["derive"] }
tracing = { version = "0.1.44", features = [] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = { version = "0.2.5", features = [] }
uuid = { version = "1.24.0", features = ["v4", "v7"] }
base64 = "0.23.1"
portable-pty = "0.9.0"
aes-gcm = "0.11.0"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac", "sha2"] }
sha2 = "0.11.0"
rand = "0.10.2"

