<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="100%" height="100%">
  <defs>
    <!-- Metallic/Forge Gradients -->
    <linearGradient id="forgeMetalLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="forgeMetalRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="forgeMetalTop" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="forgeMetalHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Tech Cyan Gradient -->
    <linearGradient id="techCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Flame Primary Gradient -->
    <linearGradient id="flamePrimary" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF3E00"/>
      <stop offset="45%" stop-color="#FF7A00"/>
      <stop offset="85%" stop-color="#FFA800"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Brand Icon -->
  <g>
    <polygon points="180,32 46,88 46,152 180,112" fill="url(#forgeMetalLeft)" opacity="0.85"/>
    <polygon points="180,32 314,88 314,152 180,112" fill="url(#forgeMetalRight)" opacity="0.9"/>
    <polygon points="46,208 46,272 180,328 180,248" fill="url(#forgeMetalLeft)" opacity="0.85"/>
    <polygon points="314,208 314,272 180,328 180,248" fill="url(#forgeMetalRight)" opacity="0.9"/>
    <polyline points="46,88 180,32 314,88" fill="none" stroke="url(#techCyan)" stroke-width="3.5" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.9"/>
    <path d="M82,108 L130,90 L130,270 L82,252 Z" fill="url(#forgeMetalLeft)"/>
    <path d="M130,90 L154,102 L154,260 L130,270 Z" fill="url(#forgeMetalTop)"/>
    <path d="M278,108 L230,90 L230,270 L278,252 Z" fill="url(#forgeMetalTop)"/>
    <path d="M230,90 L206,102 L206,260 L230,270 Z" fill="url(#forgeMetalLeft)"/>
    <polygon points="130,168 180,154 230,168 180,182" fill="url(#forgeMetalHighlight)"/>
    <polygon points="130,168 180,182 230,168 230,196 180,214 130,196" fill="url(#forgeMetalLeft)"/>
    <polyline points="46,272 180,328 314,272" fill="none" stroke="url(#flamePrimary)" stroke-width="3.5" stroke-linecap="butt" stroke-linejoin="miter" opacity="0.95"/>
  </g>
</svg>
